<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Członki</title>
	<style>
		body {
			background-color: white;
			margin: 0;
			text-align: center;
			font-family: sans-serif;
		}
		#header {
			position: relative;
			text-align: center;
			background-color: #8f8f8f;
			width: 100%;
			height: 5vh;
			border-bottom: solid black 2px;
		}
		.ag {
			position: relative;
			color: black;
			text-decoration: none;
			border: solid black 2px;
			display: inline-block;
			height: 2vh;
			width: 4vw;
			font-size: 1vw;
			top: 25%;
			margin-left: 1vw;
		}
		#sg {
			margin: 0;
			position: absolute;
			left: 2vw;
			top: 25%;
		}
		#zalogin {
			display: none;
		}
		#pokoje {
			padding: 5px;
		}
		.rom {
			width: 20vw;
			height: 10vh;
		}
	</style>
</head>
<body>
	<div id="zalogin">
		<h1>Nie jesteś zalogowany</h1>
		<a href="login.html">
		<h2>Zaloguj się tu</h2>
		</a>
	</div>
	<div id="content">
	<div id="header">
		<a href="index.html" class="ag" id="sg" title="Strona Główna">SG</a>
		<a href="gry.html" class="ag">Gry</a>
		<a href="członki.html" class="ag">Członki</a>
	</div>
	<h1>Członki</h1>
	<div id="dv"></div>
	<script>
		const zalogowany = localStorage.getItem('zalogowany');
		const osub = localStorage.getItem('osoba');
		if (zalogowany === 'true' && osoba) {
			document.getElementById("zalogin").style.display = "block";
			document.getElementById("content").style.display = "none";
		}
	</script>
	<script>
		const dv = document.getElementById("dv");
		fetch('loginy.json')
			.then(res => {
				if (!res.ok) throw new Error("Błąd ładowania pliku JSON");
				return res.json();
			})
			.then(data => {
				const klucze = Object.keys(data);
				klucze.forEach(klucz => {
					const p = document.createElement('p');
					p.className = "p";
					p.textContent = klucz;
					dv.appendChild(p);
				});
			})
			.catch(err => {
				console.error("Wystąpił błąd:", err);
				dv.textContent = "Nie udało się załadować danych";
			});
	</script>
</body>
</html>

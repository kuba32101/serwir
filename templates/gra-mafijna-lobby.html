<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Pokoje mafia</title>
	<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
	<style>
		body {
			background-color: white;
			margin: 0;
			text-align: center;
			font-family: sans-serif;
		}
		#header {
			position: relative;
			text-align: center;
			background-color: #8f8f8f;
			width: 100%;
			height: 5vh;
			border-bottom: solid black 2px;
		}
		.ag {
			position: relative;
			color: black;
			text-decoration: none;
			border: solid black 2px;
			display: inline-block;
			height: 2vh;
			width: 4vw;
			font-size: 1vw;
			top: 25%;
			margin-left: 1vw;
		}
		#sg {
			margin: 0;
			position: absolute;
			left: 2vw;
			top: 25%;
		}
		#zalogin {
			display: none;
		}
		#pokoje {
			padding: 5px;
		}
		.rom {
			width: 20vw;
			height: 10vh;
			border: 2px solid black;
			position: relative;
			left: 10vw;
			display: inline-block;
		}
		#btn {
			width: 80px;
			height: 40px;
			display: inline-block;
			position: absolute;
			top: 10vh;
			left: 2vw;
		}
		#menuPokoik {
			display: none;
		}
	</style>
</head>
<body>
	<div id="zalogin">
		<h1>Nie jesteś zalogowany</h1>
		<a href="login.html">
		<h2>Zaloguj się tu</h2>
		</a>
	</div>
	<div id="content">
	<div id="header">
		<a href="index.html" class="ag" id="sg" title="Strona Główna">SG</a>
		<a href="gry.html" class="ag">Gry</a>
		<a href="członki.html" class="ag">Członki</a>
	</div>
	<div id="pokoje"></div>
	<button id="btn" onclick="menuPukoj()"><strong>Stwórz pokój</strong></button>
	</div>
	<div id="menuPokoik">
		<h2>Jaka nazwa?</h2>
		<input type="text" id="inpN" placeholder="Wpisz nazwę" required>
		<button id="sendNazw" onclick="robPokoj()">Stwórz</button>
	</div>
	<script>
		const zalogowany = localStorage.getItem('zalogowany');
		const osub = localStorage.getItem('osoba');
		if (zalogowany !== 'true' && osub) {
			document.getElementById("zalogin").style.display = "block";
			document.getElementById("content").style.display = "none";
		}
	</script>
	<script>
		const content = document.getElementById("content");
		const sendNazw = document.getElementById("sendNazw");
		const Nazwa = document.getElementById("inpN");
		const menuPokoj = document.getElementById("menuPokoik");
		const btn = document.getElementById("btn");
		const rooms = document.getElementById("pokoje");
	
		const socket = io();
		
		function menuPukoj() {
			content.style.display = "none";
			menuPokoj.style.display = "block";
		}
		function robPokoj() {
			let nazwa = Nazwa.value.trim();
			if (nazwa !== "") {
				socket.emit('robPokoj', nazwa);
				content.style.display = "block";
				menuPokoj.style.display = "none";
				Nazwa.value = "";
			}
		}
		
		socket.on('connectRom', (data) => {
			rooms.innerHTML = "";
			data.forEach((pokojNazwa) => {
				robElementPokoj(pokojNazwa);
			});
		});
		socket.on('pokujOK', (data) => {
			robElementPokoj(data);
		});
		function robElementPokoj(x) {
			if (document.getElementById("room-" + x)) return;
			const newRoom = document.createElement('div');
			newRoom.className = "rom";
			newRoom.innerText = x;
			rooms.appendChild(newRoom);
		}
		socket.on('pokujNE', () => {
			document.open();
			document.write(
			`<h1 style="color: red">Ten pokój już istnieje!</h1><br>
			Zostaniesz przeniesiony na stronę za 2 sekundy.
			<script>
				setTimeout(() => {
					window.location.href = "/gra-mafijna-lobby"
				}, 2000);
			<\/script>`
			);
			document.close();
		});
	</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>TEST</title>
	<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
	<style>
		body {font-family: sans-serif; text-align: center; margin: 20px;}
		textarea {width: 100%; height: 200px; font-size: 16px;}
		.info {margin-top: 10px; color: #666; font-size: 14px;}
		#tu {
			white-space: pre-line;
			max-height: 300px;
			overflow-y: auto;
			text-align: left;
			border: 1px solid black;
			padding: 5px;
			margin-top: 10px;
		}
	</style>
</head>
<body>
	<h1>"Czat"</h1>
	<textarea id="sharedText" placeholder='pisz na "Czat"'></textarea><br>
	<button id="sendBtn">Wyślij</button>
	<div class="info">
		Każdy, kto wejdzie tu widzi ten sam tekst.
	</div><br>
	<div id="tu"></div>

	<script>
		const textarea = document.getElementById('sharedText');
		const sendBtn = document.getElementById('sendBtn');
		const outputSpan = document.getElementById('tu');

		const socket = io();  // łączy się z http://localhost:5000

		socket.on('connect', () => {
			console.log('Połączono z Socket.IO');
		});

		socket.on('connect_error', (err) => {
			console.error('Błąd połączenia:', err);
		});

		socket.on('update_text', (text) => {
			if (text === "") return; else{ 
			console.log('update_text z serwera:', text);
			outputSpan.textContent += text + "\n";
			}
		});

		sendBtn.addEventListener('click', () => {
			const text = textarea.value;
			console.log('wysyłam text_changed:', text);
			socket.emit('text_changed', { text });
			textarea.value = '';
		});
	</script>
</body>

</html>
